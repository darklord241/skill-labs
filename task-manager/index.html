<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Manager</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="head">
    <div class="logo">📝</div>
    <div class="heading">Task Manager</div>
    <div class="counter" id="counter"></div>
</div>

<!-- Search + filter + sort -->
<div class="toolbar">
    <input type="text" id="searchInput" placeholder="🔍 Search tasks...">

    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="done">Done</button>
    </div>

    <select id="sortSelect">
        <option value="newest">Sort: Newest</option>
        <option value="oldest">Sort: Oldest</option>
        <option value="priority-high">Sort: Priority (high → low)</option>
        <option value="priority-low">Sort: Priority (low → high)</option>
        <option value="name">Sort: Name (A → Z)</option>
    </select>

    <button id="clearDone">Clear completed</button>
</div>

<div class="main"></div>

<div class="add-button" id="add" title="Add task">+</div>

<!-- Add task popup -->
<div id="model-box">
    <div class="content">
        <h2>Add new Task</h2>
        <input type="text" id="nameInput" placeholder="Task Name">
        <textarea id="descInput" placeholder="Short description"></textarea>
        <textarea id="detailInput" placeholder="Full details / steps"></textarea>
        <div class="modal-buttons">
            <button id="addNewTask">Add to list</button>
            <button id="closeModel">Cancel</button>
        </div>
    </div>
</div>

<!-- Detail popup -->
<div id="detail-view">
    <div class="detail-content">
        <h1 id="detail-title"></h1>
        <p id="detail-text"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
